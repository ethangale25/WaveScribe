name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: node scripts/copy-ort.mjs
      - run: npx vite build
      # Create the release up front. electron-builder 26.15 uploads files in parallel and each upload
      # tried to create the release, which left two releases for one tag (v1.0.4); into an existing
      # release it only uploads.
      - name: Create GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishes the installer, its blockmap and latest.yml (which the in-app updater reads).
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
